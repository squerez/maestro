[project]
name = "maestro"
version = "0.1.0"
description = "A metadata-driven data engineering framework with plugin registry, observability, and lineage tracking"
authors = [{name = "squerez"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "networkx>=3.1",
    "pydantic>=2.0",
    "loguru>=0.7.0",
    "tenacity>=9.0",
    "pybreaker>=1.4",
    "pyrate-limiter>=4.0",
    "requests>=2.32",
    "httpx>=0.28",
]

[project.optional-dependencies]
observability = ["prometheus-client>=0.20", "pyinstrument>=4.0"]
lineage = ["openlineage-python>=1.0"]
ui = ["fastapi>=0.111", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "prometheus-client>=0.20"]
quality = ["great-expectations>=1.0"]
databricks = ["databricks-sdk>=0.18", "databricks-connect>=15.0"]
polars = ["polars>=1.0"]
all = [
    "prometheus-client>=0.20",
    "pyinstrument>=4.0",
    "openlineage-python>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "great-expectations>=1.0",
    "databricks-sdk>=0.18",
    "databricks-connect>=15.0",
    "polars>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.3",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "pytest-timeout>=2.1",
    "pytest-xdist>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
