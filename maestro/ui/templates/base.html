<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maestro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-[#0A0A0F] text-white antialiased">
    <div class="flex h-full min-h-screen">

        <!-- Sidebar -->
        <aside class="fixed inset-y-0 left-0 w-56 bg-[#0F0E17] border-r border-gray-800 flex flex-col z-10">

            <!-- Logo -->
            <div class="flex items-center gap-3 px-5 py-6 border-b border-gray-800">
                <img src="/static/logo.svg" alt="maestro logo" width="40" height="40" class="flex-shrink-0" />
                <span class="text-white font-bold text-lg tracking-tight">maestro</span>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 px-3 py-4 space-y-1">
                <a
                    href="/"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
                        {% if active == 'dashboard' %}
                            bg-indigo-900/30 text-indigo-400
                        {% else %}
                            text-gray-400 hover:text-white hover:bg-gray-800/50
                        {% endif %}"
                >
                    <!-- Icon: chart bar -->
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
                    </svg>
                    Dashboard
                </a>

                <a
                    href="/transforms"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
                        {% if active == 'transforms' %}
                            bg-indigo-900/30 text-indigo-400
                        {% else %}
                            text-gray-400 hover:text-white hover:bg-gray-800/50
                        {% endif %}"
                >
                    <!-- Icon: cube -->
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
                    </svg>
                    Transforms
                </a>

                <!-- Observability section -->
                <div class="pt-3 pb-1">
                    <p class="px-3 text-xs font-medium text-gray-600 uppercase tracking-widest">Observability</p>
                </div>

                <a
                    href="/observability"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
                        {% if active == 'observability' %}
                            bg-indigo-900/30 text-indigo-400
                        {% else %}
                            text-gray-400 hover:text-white hover:bg-gray-800/50
                        {% endif %}"
                >
                    <!-- Icon: signal -->
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
                    </svg>
                    Prometheus
                </a>

                <a
                    href="/grafana"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
                        {% if active == 'grafana' %}
                            bg-indigo-900/30 text-indigo-400
                        {% else %}
                            text-gray-400 hover:text-white hover:bg-gray-800/50
                        {% endif %}"
                >
                    <!-- Icon: squares on chart -->
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 14.25v2.25m3-4.5v4.5m3-6.75v6.75m3-9v9M6 20.25h12A2.25 2.25 0 0 0 20.25 18V6A2.25 2.25 0 0 0 18 3.75H6A2.25 2.25 0 0 0 3.75 6v12A2.25 2.25 0 0 0 6 20.25Z" />
                    </svg>
                    Grafana
                </a>

                <a
                    href="/quality"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
                        {% if active == 'quality' %}
                            bg-indigo-900/30 text-indigo-400
                        {% else %}
                            text-gray-400 hover:text-white hover:bg-gray-800/50
                        {% endif %}"
                >
                    <!-- Icon: shield check -->
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
                    </svg>
                    Data Quality
                </a>

                <a
                    href="/lineage"
                    class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
                        {% if active == 'lineage' %}
                            bg-indigo-900/30 text-indigo-400
                        {% else %}
                            text-gray-400 hover:text-white hover:bg-gray-800/50
                        {% endif %}"
                >
                    <!-- Icon: arrows pointing outward (lineage) -->
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
                    </svg>
                    Lineage
                </a>
            </nav>

            <!-- Version footer -->
            <div class="px-5 py-4 border-t border-gray-800">
                <p class="text-gray-600 text-xs">v0.1.0</p>
            </div>

        </aside>

        <!-- Main content -->
        <main class="flex-1 ml-56 min-h-screen overflow-y-auto">
            <div class="px-8 py-8">
                {% block content %}{% endblock %}
            </div>
        </main>

    </div>
</body>
</html>
